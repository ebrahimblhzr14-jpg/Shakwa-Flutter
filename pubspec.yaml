name: shakwa_app
description: "A new Flutter project for Complaint Management System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  go_router: ^14.8.1
  get_it: ^8.0.3
  dartz: ^0.10.1
  equatable: ^2.0.7
  dio: ^5.11.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  intl: 0.20.2
  flutter_svg: ^2.0.17
  flutter_riverpod: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
